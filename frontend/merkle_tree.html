<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NeerChain Merkle Tree</title>
  <script src="https://cdn.jsdelivr.net/npm/web3@1.10.0/dist/web3.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial; background: white; padding: 30px; }
    h1 { color: #0077b6; text-align: center; margin-bottom: 5px; font-size: 20px; }
    p.subtitle { text-align: center; color: #888; margin-bottom: 15px; font-size: 12px; }
    #status { text-align: center; font-size: 13px; margin-bottom: 15px; color: #e67e22; font-weight: bold; }
    button {
      display: block; margin: 0 auto 20px;
      padding: 10px 25px; background: #0077b6;
      color: white; border: none; border-radius: 5px;
      cursor: pointer; font-size: 13px;
    }
    button:hover { background: #005f8e; }
    .tree-wrapper { width: 100%; overflow: auto; padding: 20px 0; }
    .tree-wrapper svg { max-width: 100%; height: auto; display: block; margin: 0 auto; }
    .merkle-note { text-align: left; font-size: 11px; color: #333; margin-top: 10px; font-style: italic; }
  </style>
</head>
<body>

  <h1>🌊 NeerChain — Merkle Tree Visualizer</h1>
  <p class="subtitle">Based on Water Safety IDS Transactions on Ethereum (Ganache)</p>
  <p id="status">Click the button to load transactions!</p>
  <button onclick="buildTree()">🔄 Load Transactions & Build Tree</button>
  <div class="tree-wrapper" id="treeWrapper"></div>
  <p class="merkle-note" id="bottomLabel"></p>

  <script>
    let web3;
    let contract;

    const contractAddress = "0xC10c4f5528664f4b414200c883faa84B2Ff4f78f"; // paste your address!

    const abi = [
      {
        "inputs": [{"internalType": "uint256","name": "index","type": "uint256"}],
        "name": "getReading",
        "outputs": [
          {"internalType": "uint256","name": "","type": "uint256"},
          {"internalType": "string","name": "","type": "string"},
          {"internalType": "int256","name": "","type": "int256"},
          {"internalType": "uint256","name": "","type": "uint256"},
          {"internalType": "uint256","name": "","type": "uint256"},
          {"internalType": "string","name": "","type": "string"},
          {"internalType": "string","name": "","type": "string"},
          {"internalType": "uint256","name": "","type": "uint256"},
          {"internalType": "uint256","name": "","type": "uint256"}
        ],
        "stateMutability": "view",
        "type": "function"
      },
      {
        "inputs": [],
        "name": "getReadingCount",
        "outputs": [{"internalType": "uint256","name": "","type": "uint256"}],
        "stateMutability": "view",
        "type": "function"
      }
    ];

    function simpleHash(str) { return web3.utils.keccak256(str); }
    function shortHash(h) { return h.substring(0, 14) + "..."; }

    function getStatusStyle(status) {
      if (status === "CRITICAL") return { fill: "#ffcccc", stroke: "#e74c3c" };
      if (status === "ALERT")    return { fill: "#fff3cc", stroke: "#f39c12" };
      return                            { fill: "#ccffee", stroke: "#27ae60" };
    }

    function txRange(from, to) {
      let labels = [];
      for (let i = from; i <= to; i++) labels.push("Tx" + String(i).padStart(2, "0"));
      return labels.join(", ");
    }

    function wrapText(text, maxCharsPerLine) {
      if (text.length <= maxCharsPerLine) return [text];
      let lines = [];
      while (text.length > 0) {
        if (text.length <= maxCharsPerLine) { lines.push(text); break; }
        let cut = text.lastIndexOf(",", maxCharsPerLine);
        if (cut === -1) cut = maxCharsPerLine;
        else cut += 1;
        lines.push(text.substring(0, cut).trim());
        text = text.substring(cut).trim();
      }
      return lines;
    }

    async function buildTree() {
      try {
        web3 = new Web3("http://127.0.0.1:7545");
        contract = new web3.eth.Contract(abi, contractAddress);
        document.getElementById("status").innerText = "⏳ Loading from Ganache...";

        const count = await contract.methods.getReadingCount().call();
        if (count == 0) {
          document.getElementById("status").innerText = "❌ No readings found! Submit some water readings first.";
          return;
        }

        let readings = [];
        for (let i = 0; i < count; i++) {
          const r = await contract.methods.getReading(i).call();
          readings.push({
            id: r[0],
            city: r[1],
            pH: (parseInt(r[2]) / 100).toFixed(2),
            turbidity: (parseInt(r[3]) / 100).toFixed(2),
            TDS: r[4],
            status: r[5],
            attackSignature: r[6],
            confidence: r[7],
            timestamp: r[8]
          });
        }

        // Hash each reading
        let leafHashes = readings.map(r =>
          simpleHash(r.id + r.city + r.pH + r.status + r.attackSignature + r.timestamp)
        );

        let paddedHashes = [...leafHashes];
        while (paddedHashes.length % 2 !== 0) paddedHashes.push(paddedHashes[paddedHashes.length - 1]);

        // Build tree levels
        let levels = [paddedHashes];
        let current = paddedHashes;
        while (current.length > 1) {
          let next = [];
          for (let i = 0; i < current.length; i += 2) {
            next.push(simpleHash(current[i] + (current[i + 1] || current[i])));
          }
          levels.push(next);
          current = next;
        }

        const merkleRoot = levels[levels.length - 1][0];
        const reversedLevels = [...levels].reverse();

        // Layout calculations
        const maxNodes = paddedHashes.length;
        const screenW = window.innerWidth - 80;
        let nodeW = Math.min(190, Math.floor((screenW - (maxNodes - 1) * 15) / maxNodes));
        nodeW = Math.max(90, nodeW);
        const nodeH = Math.round(nodeW * 0.75);
        const hGap = Math.max(8, Math.floor(nodeW * 0.08));
        const vGap = Math.max(55, Math.floor(nodeH * 0.5));

        const svgWidth = maxNodes * (nodeW + hGap) + 60;
        const svgHeight = reversedLevels.length * (nodeH + vGap) + 140;

        const fontScale = nodeW / 190;
        const fLarge = Math.max(6, Math.round(11 * fontScale));
        const fMed   = Math.max(6, Math.round(9  * fontScale));
        const fSmall = Math.max(5, Math.round(8  * fontScale));
        const fTiny  = Math.max(5, Math.round(7  * fontScale));
        const lineH  = Math.max(9, Math.round(14 * fontScale));
        const wrapChars = Math.max(14, Math.round(28 * fontScale));

        // Calculate positions
        let allPositions = [];
        reversedLevels.forEach((levelHashes, levelIdx) => {
          const y = levelIdx * (nodeH + vGap) + 40;
          const totalWidth = levelHashes.length * (nodeW + hGap) - hGap;
          const startX = (svgWidth - totalWidth) / 2;
          let positions = [];
          levelHashes.forEach((_, nodeIdx) => {
            const x = startX + nodeIdx * (nodeW + hGap);
            positions.push({ x, y, cx: x + nodeW / 2, cy: y + nodeH / 2 });
          });
          allPositions.push(positions);
        });

        let lines = "";
        let nodes = "";

        let defs = `<defs>
          <marker id="arrow" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
            <path d="M0,0 L0,6 L6,3 z" fill="#333"/>
          </marker>
        </defs>`;

        function getTxRange(levelIdx, nodeIdx) {
          const leafLevel = reversedLevels.length - 1;
          const span = Math.pow(2, leafLevel - levelIdx);
          const from = nodeIdx * span + 1;
          const to = Math.min(from + span - 1, readings.length);
          return { from, to };
        }

        // Draw nodes and lines
        reversedLevels.forEach((levelHashes, levelIdx) => {
          const isRoot = levelIdx === 0;
          const isLeaf = levelIdx === reversedLevels.length - 1;

          levelHashes.forEach((hash, nodeIdx) => {
            const pos = allPositions[levelIdx][nodeIdx];

            // Draw connecting lines
            if (!isLeaf && allPositions[levelIdx + 1]) {
              const childLeft  = allPositions[levelIdx + 1][nodeIdx * 2];
              const childRight = allPositions[levelIdx + 1][nodeIdx * 2 + 1];
              if (childLeft) {
                lines += `<line x1="${pos.cx}" y1="${pos.y + nodeH}" x2="${childLeft.cx}" y2="${childLeft.y}" stroke="#333" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>`;
              }
              if (childRight && nodeIdx * 2 + 1 < allPositions[levelIdx + 1].length) {
                lines += `<line x1="${pos.cx}" y1="${pos.y + nodeH}" x2="${childRight.cx}" y2="${childRight.y}" stroke="#333" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>`;
              }
            }

            let fill = "#dbeafe";
            let stroke = "#3b82f6";
            let textLines = [];

            if (isRoot) {
              // Merkle Root node
              fill = "#dbeafe"; stroke = "#0077b6";
              const allTx = readings.map((_, i) => "Tx" + String(i + 1).padStart(2, "0")).join(", ");
              const wrappedHash = wrapText(`Hash(${allTx})`, wrapChars);
              textLines.push({ text: "Merkle Root — NeerChain", bold: true, size: fMed });
              wrappedHash.forEach(l => textLines.push({ text: l, bold: false, size: fSmall, color: "#1e40af" }));
              textLines.push({ text: shortHash(merkleRoot), bold: false, size: fSmall, color: "#555" });

            } else if (!isLeaf) {
              // Intermediate nodes
              fill = "#dbeafe"; stroke = "#0077b6";
              const range = getTxRange(levelIdx, nodeIdx);
              const txLabel = txRange(range.from, Math.min(range.to, readings.length));
              const wrappedHash = wrapText(`Hash(${txLabel})`, wrapChars);
              wrappedHash.forEach(l => textLines.push({ text: l, bold: true, size: fMed, color: "#1e40af" }));
              textLines.push({ text: shortHash(hash), bold: false, size: fSmall, color: "#555" });

            } else {
              // Leaf nodes — water reading data
              const r = readings[nodeIdx];
              if (r) {
                const style = getStatusStyle(r.status);
                fill = style.fill; stroke = style.stroke;
                const date = new Date(parseInt(r.timestamp) * 1000).toLocaleDateString();
                textLines = [
                  { text: `Tx${String(nodeIdx + 1).padStart(2, "0")}`, bold: true, size: fLarge, color: "#000" },
                  { text: `City: ${r.city}`, bold: false, size: fMed, color: "#000" },
                  { text: `pH: ${r.pH} | TDS: ${r.TDS}`, bold: false, size: fMed, color: "#000" },
                  { text: `Status: ${r.status}`, bold: false, size: fMed, color: stroke },
                  { text: `Sig: ${r.attackSignature}`, bold: false, size: fTiny, color: "#444" },
                  { text: `Conf: ${r.confidence}%`, bold: false, size: fTiny, color: "#444" },
                  { text: `Date: ${date}`, bold: false, size: fTiny, color: "#444" },
                  { text: shortHash(leafHashes[nodeIdx]), bold: false, size: fTiny, color: "#777" }
                ];
              } else {
                fill = "#f0f0f0"; stroke = "#bbb";
                textLines = [{ text: "Duplicate", bold: true, size: fMed }];
              }
            }

            // Draw rectangle
            nodes += `<rect x="${pos.x}" y="${pos.y}" width="${nodeW}" height="${nodeH}" rx="3" ry="3" fill="${fill}" stroke="${stroke}" stroke-width="1.5"/>`;

            // Draw text
            textLines.forEach((line, li) => {
              const ty = pos.y + Math.round(lineH * 0.9) + li * lineH;
              if (ty < pos.y + nodeH - 4) {
                nodes += `<text x="${pos.cx}" y="${ty}" text-anchor="middle" fill="${line.color || '#000'}" font-size="${line.size}" font-weight="${line.bold ? 'bold' : 'normal'}" font-family="Arial">${line.text}</text>`;
              }
            });
          });
        });

        // Brackets at bottom
        const leafPositions = allPositions[allPositions.length - 1];
        const bracketY = leafPositions[0].y + nodeH + 20;
        const half = Math.floor(leafPositions.length / 2);
        const bf = Math.max(7, Math.round(10 * fontScale));

        const lx1 = leafPositions[0].x;
        const lx2 = leafPositions[half - 1].x + nodeW;
        lines += `<line x1="${lx1}" y1="${bracketY}" x2="${lx2}" y2="${bracketY}" stroke="#333" stroke-width="1"/>`;
        lines += `<line x1="${lx1}" y1="${bracketY-6}" x2="${lx1}" y2="${bracketY}" stroke="#333" stroke-width="1"/>`;
        lines += `<line x1="${lx2}" y1="${bracketY-6}" x2="${lx2}" y2="${bracketY}" stroke="#333" stroke-width="1"/>`;
        nodes += `<text x="${(lx1+lx2)/2}" y="${bracketY+13}" text-anchor="middle" fill="#333" font-size="${bf}" font-family="Arial">CRITICAL / ALERT Transactions</text>`;
        nodes += `<text x="${(lx1+lx2)/2}" y="${bracketY+25}" text-anchor="middle" fill="#333" font-size="${bf}" font-family="Arial">Flagged by IDS — Authority Notified</text>`;

        if (leafPositions.length > half) {
          const rx1 = leafPositions[half].x;
          const rx2 = leafPositions[leafPositions.length - 1].x + nodeW;
          lines += `<line x1="${rx1}" y1="${bracketY}" x2="${rx2}" y2="${bracketY}" stroke="#333" stroke-width="1"/>`;
          lines += `<line x1="${rx1}" y1="${bracketY-6}" x2="${rx1}" y2="${bracketY}" stroke="#333" stroke-width="1"/>`;
          lines += `<line x1="${rx2}" y1="${bracketY-6}" x2="${rx2}" y2="${bracketY}" stroke="#333" stroke-width="1"/>`;
          nodes += `<text x="${(rx1+rx2)/2}" y="${bracketY+13}" text-anchor="middle" fill="#333" font-size="${bf}" font-family="Arial">SAFE Transactions</text>`;
          nodes += `<text x="${(rx1+rx2)/2}" y="${bracketY+25}" text-anchor="middle" fill="#333" font-size="${bf}" font-family="Arial">Logged — No Action Required</text>`;
        }

        const svgFinal = `<svg width="${svgWidth}" height="${svgHeight+50}" viewBox="0 0 ${svgWidth} ${svgHeight+50}" xmlns="http://www.w3.org/2000/svg" style="max-width:100%;height:auto;">
          <rect width="${svgWidth}" height="${svgHeight+50}" fill="white"/>
          ${defs}${lines}${nodes}
          <text x="30" y="${svgHeight+35}" fill="#333" font-size="11" font-family="Arial" font-style="italic">Merkle Tree — NeerChain Water Safety IDS DApp | Ganache + Ethereum</text>
        </svg>`;

        document.getElementById("treeWrapper").innerHTML = svgFinal;
        document.getElementById("status").innerText = `✅ Merkle Tree built with ${count} water safety transactions!`;
        document.getElementById("status").style.color = "#27ae60";

      } catch (err) {
        document.getElementById("status").innerText = "❌ Error! Make sure Ganache is running and readings exist.";
        document.getElementById("status").style.color = "#e74c3c";
        console.error(err);
      }
    }
  </script>
</body>
</html>
